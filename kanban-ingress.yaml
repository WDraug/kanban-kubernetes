apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanban-gateway
spec:
  rules:
  - host: kanban.local
    http:
      paths:
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: task-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80
